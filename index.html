<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng ký lịch lên lab · Business AI Lab</title>
<style>body{font-family:system-ui,sans-serif;background:#f6f8fb;color:#182433;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;text-align:center}
.b{padding:24px;max-width:420px}img{height:110px;margin-bottom:16px}a{color:#1c2b9a}</style></head>
<body><div class="b"><img src="logo.png" alt="Business AI Lab">
<h2 id="t">Đang chuyển đến trang đăng ký lịch…</h2><p id="m"></p></div>
<script>
var P="https://gist.githubusercontent.com/NonomiyaIzumi/8749ef67c1a56d8f46df011e7fb018a8/raw/reg_config.json";
fetch(P+"?t="+Date.now()).then(function(r){return r.json()}).then(function(d){
  if(!d.reg_url||d.reg_url.indexOf("https://")!==0)throw 0;
  location.replace(d.reg_url);
}).catch(function(){
  document.getElementById("t").textContent="Chưa mở được trang đăng ký";
  document.getElementById("m").innerHTML="Máy chủ có thể đang khởi động lại. Chờ vài phút rồi <a href=''>thử lại</a>.";
});
</script></body></html>
